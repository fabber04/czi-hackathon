[theme]
base = "light"
primaryColor = "#0B6E4F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F8"
textColor = "#15202B"
linkColor = "#0B6E4F"
borderColor = "#D8DEE6"
dataframeBorderColor = "#D8DEE6"
dataframeHeaderBackgroundColor = "#F4F6F8"
codeBackgroundColor = "#F4F6F8"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["2rem", "1.4rem", "1.15rem", "1rem", "0.9rem", "0.8rem"]
headingFontWeights = [650, 600, 600, 600, 500, 500]
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false
chartCategoricalColors = ["#0B6E4F", "#1B4F72", "#C9A227", "#C0392B", "#5D6D7E", "#1ABC9C"]
greenColor = "#0B6E4F"
blueColor = "#1B4F72"
redColor = "#C0392B"
orangeColor = "#C9A227"
grayColor = "#5D6D7E"

[theme.sidebar]
backgroundColor = "#0F2A3D"
secondaryBackgroundColor = "#16364C"
textColor = "#F4F7FA"
borderColor = "#1E4A66"
primaryColor = "#3DDC97"
